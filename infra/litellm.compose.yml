# Run with --env-file <private-env-file>; use a separate database and preserve SALT_KEY.
services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.106.1
    ports:
      - "127.0.0.1:${AH_LITELLM_PORT:-4320}:4000"
    environment:
      DATABASE_URL: ${AH_LITELLM_DATABASE_URL:?set a separate LiteLLM database}
      LITELLM_MASTER_KEY: ${AH_LITELLM_MASTER_KEY:?set a private management key}
      LITELLM_SALT_KEY: ${AH_LITELLM_SALT_KEY:?set a persistent encryption key}
      STORE_MODEL_IN_DB: "True"
      AH_LANGFUSE_HOST: ${AH_LANGFUSE_HOST:-}
      AH_LANGFUSE_PUBLIC_KEY: ${AH_LANGFUSE_PUBLIC_KEY:-}
      AH_LANGFUSE_SECRET_KEY: ${AH_LANGFUSE_SECRET_KEY:-}
      AH_LANGFUSE_CONTENT_MODE: ${AH_LANGFUSE_CONTENT_MODE:-metadata}
      AH_LANGFUSE_CONTAINER_PROXY: ${AH_LANGFUSE_CONTAINER_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,host.docker.internal
    volumes:
      - ./litellm.config.yaml:/app/harbor.yaml:ro
      - ./start-litellm.py:/app/harbor-start.py:ro
      - ./langfuse:/app/harbor-observation:ro
    entrypoint: ["python", "/app/harbor-start.py"]
    command: ["--port", "4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveness', timeout=3).read()"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 60s
