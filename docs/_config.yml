title: Agent Harbor
description: 自托管的 Claude Code 工作台
lang: zh-CN
url: https://chenyk2016.github.io
baseurl: /agent-harbor
repository: chenyk2016/agent-harbor
github_username: chenyk2016
theme: minima
markdown: kramdown
strict_front_matter: true

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag

header_pages:
  - product-overview.md
  - getting-started.md
  - guide.md
  - manage.md
  - concepts.md

# Product documentation only. Engineering material stays in the repository.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - articles
  - evidence
  - specs
  - spec
  - design
  - plans
  - theme
  - architecture.md
  - code-reading.md
  - dependency-runtime.md
  - http-routing.md
  - llm-baseline.md
  - migration.md
  - package-readme.md
  - pages-publishing.md
  - product-quality.md
  - react-web.md
  - releasing.md
  - roadmap.md
  - service.md
  - streaming-validation.md
  - testing.md
  - users-and-limits.md
  - web-client.md
