name: Documentation Pages

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'infra/seccomp.md'
      - 'infra/opensandbox/README.md'
      - 'infra/app-edge.example.json'
      - 'infra/app-observation.Caddyfile'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/docs-pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - uses: actions/configure-pages@v5
        id: pages
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      - run: python -m mkdocs build --strict
        env:
          HARBOR_DOCS_URL: ${{ steps.pages.outputs.base_url }}
          HARBOR_DOCS_REPO: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          path: var/docs-site

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
