name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: harbor_test
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: harbor_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U harbor_test -d harbor_test" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      AH_TEST_DATABASE_URL: postgres://harbor_test:fixture-only@127.0.0.1:5432/harbor_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run audit:public
